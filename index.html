function slide(f1,f2,d,ty,v,at){try{const a=ac(),o=a.createOscillator(),g=a.createGain(),t=a.currentTime+(at||0);o.type=ty;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(.25*v+.0001,t);g.gain.exponentialRampToValueAtTime(.0005,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d)}catch(x){}}
